[project]
name = "simple_auto_cover"
version = "2.0.0"
description = "Simple Auto Cover"
authors = [{ name = "Travis Pew" }]
requires-python = ">=3.13.2,<3.14"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Travis Pew" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
]
dependencies = ["homeassistant==2025.6.3"]

[project.urls]
Homepage = "https://github.com/travisp/adaptive-cover"
Repository = "https://github.com/travisp/adaptive-cover"
Documentation = "https://github.com/travisp/adaptive-cover"
"Bug Tracker" = "https://github.com/travisp/adaptive-cover/issues"
Changelog = "https://github.com/travisp/adaptive-cover/releases"

[dependency-groups]
dev = [
    "pre-commit==4.2.0",
    "pre-commit-hooks==5.0.0",
    "pylint==3.3.1",
    "ruff==0.6.9",
    "pytest==8.3.5",
    "pytest-homeassistant-custom-component==0.13.254",
    "numpy",
    "python-dateutil",
    "colorlog~=6.8",
    "pvlib>=0.11,<0.12",
    "matplotlib~=3.9",
    "ipykernel~=6.29",
]

[tool.hatch.build.targets.sdist]
include = ["custom_components/simple_auto_cover"]

[tool.hatch.build.targets.wheel]
include = ["custom_components/simple_auto_cover"]

[tool.hatch.build.targets.wheel.sources]
"custom_components/simple_auto_cover" = "simple_auto_cover"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
ignore = [
  "ANN101", # Self... explanatory
  "ANN401", # Opiniated warning on disallowing dynamically typed expressions
  "D203", # Conflicts with other rules
  "D213", # Conflicts with other rules
  "TID252", # Relative imports
  "RUF012", # Just broken

  # Formatter conflicts
  "COM812",
  "COM819",
  "D206",
  "E501",
  "ISC001",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]
select = ["ALL"]
src = ["custom_components/simple_auto_cover"]

[tool.ruff.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
voluptuous = "vol"

[tool.ruff.isort]
force-sort-within-sections = true
known-first-party = [
    "homeassistant",
]
combine-as-imports = true

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff
# duplicate-code - unavoidable
# used-before-assignment - false positives with TYPE_CHECKING structures
disable = [
  "format",
  "duplicate-code",
  "used-before-assignment",
]
